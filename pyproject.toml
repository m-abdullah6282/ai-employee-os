[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-employee-os"
version = "0.1.0"
description = "AI-powered business operating system with multi-agent automation"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "httpx==0.27.2",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "greenlet==3.1.1",
    "redis==5.2.1",
    "celery[redis]==5.4.0",
    "langchain==0.3.10",
    "langchain-openai==0.2.10",
    "langchain-anthropic==0.3.0",
    "langgraph==0.2.55",
    "langsmith==0.1.147",
    "openai==1.56.2",
    "anthropic==0.40.0",
    "tiktoken==0.8.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.17",
    "pypdf==5.1.0",
    "reportlab==4.2.5",
    "google-auth==2.36.0",
    "google-auth-oauthlib==1.2.1",
    "google-api-python-client==2.154.0",
    "twilio==9.3.6",
    "stripe==11.3.0",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
    "orjson==3.10.12",
    "pendulum==3.0.0",
    "tenacity==9.0.0",
    "rich==13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "ruff==0.8.3",
    "mypy==1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]